<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · Mi POS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%A7%BE%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <div class="brand">🧾 Mi POS</div>
      <div class="subtitle">Inicia sesión para continuar</div>
      <div id="login-error" class="login-error"></div>
      <form id="login-form">
        <div class="field">
          <label for="username">Usuario</label>
          <input type="text" id="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="primary" style="width:100%" id="login-btn">Entrar</button>
      </form>
      <p class="text-muted mt-16" style="text-align:center; font-size:12px;">
        Usuario de prueba: <strong>admin</strong> / <strong>admin123</strong>
      </p>
    </div>
  </div>

  <script type="module">
    import { api, setSession, getToken } from '/js/api.js';

    if (getToken()) {
      window.location.href = '/pos.html';
    }

    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Entrando…';
      try {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const result = await api.post('/api/auth/login', { username, password });
        setSession(result.token, result.user);
        window.location.href = '/pos.html';
      } catch (err) {
        errorBox.textContent = err.message || 'No se pudo iniciar sesión.';
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
